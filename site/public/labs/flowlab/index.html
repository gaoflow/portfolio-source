<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowLab — 实时流体仿真实验室</title>
  <link rel="icon" type="image/png" href="/avatar_memoji_05_nobg.png" />
  <link rel="apple-touch-icon" href="/avatar_memoji_05_nobg.png" />
  <style>
    :root {
      --color-bg: #f5f4ed;
      --color-surface: #faf9f5;
      --color-edge: #e8e6dc;
      --color-ink: #141413;
      --color-warm: #3d3d3a;
      --color-muted: #504e49;
      --color-stone: #6b6a64;
      --color-accent: #1b365d;
      --color-tag: #e4ecf5;
      --font-serif: "Source Serif 4", Charter, Georgia, "Times New Roman", serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 16px;
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-serif);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(780px, 100%); }
    header { margin-bottom: 18px; }
    .nav-back {
      color: var(--color-muted);
      text-decoration: none;
      font-size: 13px;
      font-family: var(--font-mono);
      display: inline-block;
      margin-bottom: 12px;
      transition: color 0.15s ease;
    }
    .nav-back:hover { color: var(--color-accent); }
    .eyebrow {
      color: var(--color-stone);
      font: 500 12px/1.2 var(--font-mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 8px 0 6px;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      line-height: 1.1;
    }
    p {
      color: var(--color-muted);
      margin: 0;
      max-width: 800px;
      font-size: 15.5px;
      line-height: 1.6;
    }
    .hint {
      margin-top: 10px;
      font-size: 13.5px;
      color: var(--color-accent);
      font-family: var(--font-mono);
      background: #edf3f9;
      padding: 8px 14px;
      border-radius: 6px;
      border-left: 3px solid var(--color-accent);
      display: inline-block;
    }
    .panel {
      border: 1px solid var(--color-edge);
      background: var(--color-surface);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px -2px rgba(20, 20, 19, 0.04);
      margin-top: 14px;
    }
    canvas {
      width: 100%;
      aspect-ratio: 3 / 2;
      display: block;
      background: #faf9f5;
      border: 1px solid var(--color-edge);
      border-radius: 8px;
      cursor: grab;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 18px;
      margin-top: 18px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-stone);
      font: 500 12px var(--font-mono);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    select, button {
      border: 1px solid var(--color-edge);
      background: var(--color-surface);
      color: var(--color-ink);
      padding: 7px 14px;
      font-family: var(--font-serif);
      font-size: 14px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    button {
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 500;
    }
    button:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
      background: #ffffff;
    }
    output {
      margin-left: auto;
      color: var(--color-accent);
      background: var(--color-tag);
      font: 500 12.5px var(--font-mono);
      padding: 6px 14px;
      border-radius: 4px;
    }
    .legend {
      height: 6px;
      margin-top: 14px;
      border-radius: 3px;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #faf9f5, #fb923c, #dc2626);
      border: 1px solid var(--color-edge);
    }
    @media (max-width: 720px) {
      body { padding: 24px 16px; }
      output { width: 100%; margin-top: 8px; text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <a href="/cn/projects/flowlab" class="nav-back">← 返回 FlowLab 项目文章</a>
        <div class="eyebrow">实时流体仿真 · 60 FPS 交互实验室</div>
        <h1>FlowLab</h1>
        <p>基于物理动量守恒的实时流体仿真求解器。顶部壁面以恒定速度向右滑动，通过黏性动量传递在方腔内部驱动顺时针旋转主涡。</p>
        <div class="hint">交互方式：按住鼠标左键在画布内滑动，可以像搅动水面一样直接为流体注入动量，激发出绚丽的动态旋涡。</div>
      </div>
    </header>
    <section class="panel">
      <canvas id="field" width="384" height="256" aria-label="Interactive fluid flow field"></canvas>
      <div class="legend" aria-hidden="true"></div>
      <div class="controls">
        <label>雷诺数 Reynolds
          <select id="reynolds"><option>100</option><option selected>400</option><option>1000</option></select>
        </label>
        <label>显示物理量 Field
          <select id="display"><option value="speed">流速幅值 Speed</option><option value="vorticity">旋度场 Vorticity</option></select>
        </label>
        <button id="toggle" type="button">暂停 Pause</button>
        <button id="reset" type="button">重置流场 Reset</button>
        <output id="metrics">初始化中...</output>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
