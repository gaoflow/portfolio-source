<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowLab — Browser LBM</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(1080px, 100%); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
    .eyebrow { color: #5eead4; font: 600 12px/1.2 ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0 4px; font-size: clamp(28px, 5vw, 52px); line-height: 1; }
    p { color: #94a3b8; margin: 0; max-width: 700px; }
    .panel { border: 1px solid #334155; background: #111c30; padding: 16px; }
    canvas { width: 100%; aspect-ratio: 3 / 2; display: block; background: #020617; image-rendering: pixelated; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 14px; }
    label { display: flex; align-items: center; gap: 8px; color: #94a3b8; font: 12px ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; }
    select, button { border: 1px solid #475569; background: #0f172a; color: #e2e8f0; padding: 8px 10px; font: inherit; }
    button { cursor: pointer; }
    button:hover { border-color: #5eead4; }
    output { margin-left: auto; color: #5eead4; font: 12px ui-monospace, monospace; }
    .legend { height: 4px; margin-top: 12px; background: linear-gradient(90deg, #172554, #0f766e, #f8fafc, #fb923c, #7f1d1d); }
    @media (max-width: 720px) { header { display: block; } output { width: 100%; margin: 0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">D2Q9 · BGK · halfway bounce-back</div>
        <h1>FlowLab</h1>
        <p>A real-time lid-driven cavity solver. The upper wall moves right; viscosity transfers momentum into a clockwise primary vortex.</p>
      </div>
    </header>
    <section class="panel">
      <canvas id="field" width="384" height="256" aria-label="Interactive lattice Boltzmann flow field"></canvas>
      <div class="legend" aria-hidden="true"></div>
      <div class="controls">
        <label>Reynolds number
          <select id="reynolds"><option>100</option><option selected>400</option><option>1000</option></select>
        </label>
        <label>Field
          <select id="display"><option value="speed">Speed</option><option value="vorticity">Vorticity</option></select>
        </label>
        <button id="toggle" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
        <output id="metrics">initialising</output>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
