<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowLab — 实时流体仿真实验室</title>
  <link rel="icon" type="image/png" href="/avatar_memoji_05_nobg.png" />
  <link rel="apple-touch-icon" href="/avatar_memoji_05_nobg.png" />
  <style>
    :root {
      --color-bg: #f5f4ed;
      --color-surface: #faf9f5;
      --color-edge: #e8e6dc;
      --color-ink: #141413;
      --color-warm: #3d3d3a;
      --color-muted: #504e49;
      --color-stone: #6b6a64;
      --color-accent: #1b365d;
      --color-tag: #e4ecf5;
      --font-serif: "Source Serif 4", Charter, Georgia, "Times New Roman", serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px 40px;
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-serif);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(1080px, 100%);
      margin: 0 auto;
    }
    header {
      max-width: 760px;
      margin-bottom: 20px;
    }
    .nav-back {
      display: inline-block;
      margin-bottom: 12px;
      color: var(--color-muted);
      font: 500 13px/1.4 var(--font-mono);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .nav-back:hover { color: var(--color-accent); }
    h1 {
      margin: 6px 0 8px;
      color: var(--color-ink);
      font-size: clamp(30px, 4vw, 44px);
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.08;
    }
    p {
      max-width: 720px;
      margin: 0;
      color: var(--color-muted);
      font-size: 15.5px;
      line-height: 1.65;
    }
    .hint {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 12px;
      border: 1px solid #dce5ef;
      border-radius: 6px;
      background: #edf3f9;
      color: var(--color-accent);
      font: 500 12.5px/1.4 var(--font-mono);
    }
    .panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 252px;
      gap: 18px;
      padding: 18px;
      border: 1px solid var(--color-edge);
      border-radius: 12px;
      background: var(--color-surface);
      box-shadow: 0 4px 20px -2px rgba(20, 20, 19, 0.04);
    }
    .visual { min-width: 0; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      border: 1px solid var(--color-edge);
      border-radius: 8px;
      background: #faf9f5;
      cursor: grab;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }
    .legend {
      height: 6px;
      margin-top: 12px;
      border: 1px solid var(--color-edge);
      border-radius: 3px;
      background: linear-gradient(90deg, #faf9f5, #0f766e, #c2410c);
    }
    .visual[data-field="vorticity"] .legend {
      background: linear-gradient(90deg, #0284c7, #faf9f5, #dc2626);
    }
    .legend-labels {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      margin-top: 6px;
      color: var(--color-stone);
      font: 500 10.5px/1.4 var(--font-mono);
    }
    .legend-labels span:nth-child(2) { color: var(--color-muted); }
    .legend-labels span:last-child { text-align: right; }
    .controls {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 18px;
      padding-left: 18px;
      border-left: 1px solid var(--color-edge);
    }
    .field-controls {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--color-stone);
      font: 500 11.5px/1.4 var(--font-mono);
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    select, button {
      width: 100%;
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid var(--color-edge);
      border-radius: 6px;
      background: var(--color-surface);
      color: var(--color-ink);
      font-size: 14px;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }
    select { font-family: var(--font-serif); }
    button {
      cursor: pointer;
      font: 500 12px/1.35 var(--font-mono);
    }
    button:hover {
      border-color: var(--color-accent);
      background: #ffffff;
      color: var(--color-accent);
    }
    select:focus-visible, button:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    output {
      display: block;
      margin-top: auto;
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--color-tag);
      color: var(--color-accent);
      font: 500 12px/1.55 var(--font-mono);
      overflow-wrap: anywhere;
    }
    @media (max-width: 860px) {
      main { width: min(760px, 100%); }
      .panel { grid-template-columns: 1fr; }
      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        padding: 18px 0 0;
        border-top: 1px solid var(--color-edge);
        border-left: 0;
      }
      .field-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .actions { min-width: 240px; }
      output {
        grid-column: 1 / -1;
        margin-top: 0;
        text-align: center;
      }
    }
    @media (max-width: 560px) {
      body { padding: 20px 12px 28px; }
      header { margin-bottom: 16px; }
      p { font-size: 15px; }
      .panel {
        gap: 14px;
        padding: 10px;
      }
      .controls {
        grid-template-columns: 1fr;
        gap: 14px;
        padding-top: 14px;
      }
      .field-controls { grid-template-columns: 1fr; }
      .actions { min-width: 0; }
      output { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <a href="/cn/projects/flowlab" class="nav-back">← 返回 FlowLab 项目文章</a>
        <h1>FlowLab Demo</h1>
        <p>这个演示想展示一件事：顶部边界持续向右移动，方腔里的流体会逐渐形成一个顺时针主涡。拖动鼠标相当于临时推了一下流体，可以观察主涡如何被扰动、再重新组织。</p>
        <div class="hint">按住鼠标左键缓慢拖动，给流体施加短暂外力</div>
      </div>
    </header>
    <section class="panel">
      <div class="visual">
        <canvas id="field" width="384" height="256" aria-label="Interactive fluid flow field"></canvas>
        <div class="legend" aria-hidden="true"></div>
        <div class="legend-labels">
          <span id="legend-low">低速</span>
          <span id="legend-centre">速度大小</span>
          <span id="legend-high">高速</span>
        </div>
      </div>
      <div class="controls">
        <div class="field-controls">
          <label>雷诺数 Reynolds
            <select id="reynolds"><option>100</option><option selected>400</option><option>1000</option></select>
          </label>
          <label>显示物理量 Field
            <select id="display"><option value="speed">流速幅值 Speed</option><option value="vorticity">旋度场 Vorticity</option></select>
          </label>
        </div>
        <div class="actions">
          <button id="toggle" type="button">暂停 Pause</button>
          <button id="reset" type="button">重置流场 Reset</button>
        </div>
        <output id="metrics">初始化中...</output>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
