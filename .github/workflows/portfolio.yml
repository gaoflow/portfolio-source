name: Portfolio CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Test and rebuild evidence catalog
        run: |
          python3 -m unittest discover -s projects/evidence-kit/tests -v
          python3 projects/evidence-kit/scripts/audit_portfolio.py
          python3 projects/evidence-kit/scripts/publish_site.py

      - name: Build static site
        run: npm --prefix site run build

      - name: Check local links and assets
        run: python3 site/scripts/check_static_links.py site/dist

      - name: Reject stale generated evidence
        run: git diff --exit-code -- projects/evidence-kit/results site/public/evidence
