name: Portfolio CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix site

      - name: Build static site
        run: npm --prefix site run build

      - name: Check SEO signals
        run: npm --prefix site run check:seo

      - name: Check local links
        run: python3 site/scripts/check_static_links.py site/dist

      - name: Check rendered content
        run: python3 site/scripts/check_rendering.py site/dist

      - name: Check image assets
        run: python3 site/scripts/check_assets.py site/public/images

      - name: Check UI colors
        run: python3 site/scripts/check_dark_ui.py site/dist

      - name: Check CV locale isolation
        run: python3 site/scripts/check_cv_locales.py site/dist
